name: Latest blog posts

# Refreshes the "Latest writing" list in README.md from the blog's RSS feed.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Pinned to the 1.9.7 release commit.
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b
        with:
          feed_list: https://atzamis-portfolio.vercel.app/feed.xml
          max_post_count: 5
          template: '- [$title]($url)$newline'
          commit_message: 'docs(readme): refresh latest blog posts'
          committer_username: sifisatz
          committer_email: iwsifatz@gmail.com
